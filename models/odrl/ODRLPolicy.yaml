$IRI: http://www.w3.org/ns/odrl/2/Policy
$defs:
  RDFModel:
    additionalProperties: false
    description: Base class for creating pydantic models convertible to RDF graph
    properties: {}
    title: RDFModel
    type: object
$namespace: http://www.w3.org/ns/odrl/2/
$ontology: https://www.w3.org/TR/odrl-vocab/#
$prefix: odrl
additionalProperties: false
description: A non-empty group of Permissions and/or Prohibitions.
properties:
  conflict:
    anyOf:
    - items:
        anyOf:
        - format: uri
          minLength: 1
          type: string
        - $ref: '#/$defs/RDFModel'
      type: array
    - type: 'null'
    default:
    description: The conflict-resolution strategy for a Policy.
    rdf_term: http://www.w3.org/ns/odrl/2/conflict
    rdf_type: uri
    title: Conflict
  permission:
    anyOf:
    - items:
        anyOf:
        - format: uri
          minLength: 1
          type: string
        - $ref: '#/$defs/RDFModel'
      type: array
    - type: 'null'
    default:
    description: Permissions take preference over prohibitions.
    rdf_term: http://www.w3.org/ns/odrl/2/permission
    rdf_type: uri
    title: Permission
  prohibition:
    anyOf:
    - items:
        anyOf:
        - format: uri
          minLength: 1
          type: string
        - $ref: '#/$defs/RDFModel'
      type: array
    - type: 'null'
    default:
    description: The inability to perform an Action over an Asset.
    rdf_term: http://www.w3.org/ns/odrl/2/prohibition
    rdf_type: uri
    title: Prohibition
  inheritFrom:
    anyOf:
    - items:
        format: uri
        minLength: 1
        type: string
      type: array
    - type: 'null'
    default:
    description: Relates a (child) policy to another (parent) policy from which terms
      are inherited.
    rdf_term: http://www.w3.org/ns/odrl/2/inheritFrom
    rdf_type: uri
    title: Inheritfrom
  profile:
    anyOf:
    - items:
        format: uri
        minLength: 1
        type: string
      type: array
    - type: 'null'
    default:
    description: The identifier(s) of an ODRL Profile that the Policy conforms to.
    rdf_term: http://www.w3.org/ns/odrl/2/profile
    rdf_type: uri
    title: Profile
  obligation:
    anyOf:
    - items:
        format: uri
        minLength: 1
        type: string
      type: array
    - type: 'null'
    default:
    description: Relates an individual Duty to a Policy.
    rdf_term: http://www.w3.org/ns/odrl/2/obligation
    rdf_type: uri
    title: Obligation
  uid:
    anyOf:
    - items:
        format: uri
        minLength: 1
        type: string
      type: array
    - type: 'null'
    default:
    description: Unique Identifier
    rdf_term: http://www.w3.org/ns/odrl/2/uid
    rdf_type: uri
    title: Uid
  relation:
    anyOf:
    - items:
        format: uri
        minLength: 1
        type: string
      type: array
    - type: 'null'
    default:
    description: Relation is an abstract property which creates an explicit link between
      an Action and an Asset.
    rdf_term: http://www.w3.org/ns/odrl/2/relation
    rdf_type: uri
    title: Relation
  target:
    anyOf:
    - items:
        format: uri
        minLength: 1
        type: string
      type: array
    - type: 'null'
    default:
    description: The target property indicates the Asset that is the primary subject
      to which the Rule action directly applies.
    rdf_term: http://www.w3.org/ns/odrl/2/target
    rdf_type: uri
    title: Target
  function:
    anyOf:
    - items:
        format: uri
        minLength: 1
        type: string
      type: array
    - type: 'null'
    default:
    description: Function is an abstract property whose sub-properties define the
      functional roles which may be fulfilled by a party in relation to a Rule.
    rdf_term: http://www.w3.org/ns/odrl/2/function
    rdf_type: uri
    title: Function
  action:
    anyOf:
    - items:
        format: uri
        minLength: 1
        type: string
      type: array
    - type: 'null'
    default:
    description: The operation relating to the Asset for which the Rule is being subjected.
    rdf_term: http://www.w3.org/ns/odrl/2/action
    rdf_type: uri
    title: Action
  constraint:
    anyOf:
    - items:
        format: uri
        minLength: 1
        type: string
      type: array
    - type: 'null'
    default:
    description: Constraint applied to a Rule
    rdf_term: http://www.w3.org/ns/odrl/2/constraint
    rdf_type: uri
    title: Constraint
  assignee:
    anyOf:
    - items:
        format: uri
        minLength: 1
        type: string
      type: array
    - type: 'null'
    default:
    description: The Party is the recipient of the Rule.
    rdf_term: http://www.w3.org/ns/odrl/2/assignee
    rdf_type: uri
    title: Assignee
  assigner:
    anyOf:
    - items:
        format: uri
        minLength: 1
        type: string
      type: array
    - type: 'null'
    default:
    description: The Party is the issuer of the Rule.
    rdf_term: http://www.w3.org/ns/odrl/2/assigner
    rdf_type: uri
    title: Assigner
title: ODRLPolicy
type: object
