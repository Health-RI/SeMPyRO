$IRI: http://www.w3.org/2006/time#Instant
$defs:
  GeneralDateTimeDescription:
    $IRI: http://www.w3.org/2006/time#GeneralDateTimeDescription
    $namespace: http://www.w3.org/2006/time#
    $ontology: https://www.w3.org/TR/owl-time/
    $prefix: time
    additionalProperties: false
    description: Description of date and time structured with separate values 
      for the various elements of a calendar-clock system
    properties:
      timeZone:
        anyOf:
        - format: uri
          minLength: 1
          type: string
        - type: 'null'
        default:
        description: The time zone for clock elements in the temporal position
        rdf_term: http://www.w3.org/2006/time#timeZone
        rdf_type: uri
        title: Timezone
      unitType:
        description: The temporal unit which provides the precision of a 
          date-time value or scale of a temporal extent
        format: uri
        minLength: 1
        rdf_term: http://www.w3.org/2006/time#unitType
        rdf_type: uri
        title: Unittype
        type: string
      hasTRS:
        description: The temporal reference system used by a temporal position 
          or extent description
        format: uri
        minLength: 1
        rdf_term: http://www.w3.org/2006/time#hasTRS
        rdf_type: uri
        title: Hastrs
        type: string
      year:
        anyOf:
        - type: string
        - type: 'null'
        default:
        description: Year position in a calendar-clock system. The range of this
          property is not specified, so can be replaced by any specific 
          representation of a calendar year from any calendar.
        rdf_term: http://www.w3.org/2006/time#year
        rdf_type: xsd:gYear
        title: Year
      month:
        anyOf:
        - type: string
        - type: 'null'
        default:
        description: Month position in a calendar-clock system. The range of 
          this property is not specified, so can be replaced by any specific 
          representation of a calendar month from any calendar.
        rdf_term: http://www.w3.org/2006/time#month
        rdf_type: xsd:gMonth
        title: Month
      day:
        anyOf:
        - type: string
        - type: 'null'
        default:
        description: Day position in a calendar-clock system. The range of this 
          property is not specified, so can be replaced by any specific 
          representation of a calendar day from any calendar.
        rdf_term: http://www.w3.org/2006/time#day
        rdf_type: xsd:gDay
        title: Day
      hour:
        anyOf:
        - minimum: 0
          type: integer
        - type: 'null'
        default:
        description: Hour position in a calendar-clock system
        rdf_term: http://www.w3.org/2006/time#hour
        rdf_type: xsd:nonNegativeInteger
        title: Hour
      minute:
        anyOf:
        - minimum: 0
          type: integer
        - type: 'null'
        default:
        description: Minute position in a calendar-clock system
        rdf_term: http://www.w3.org/2006/time#minute
        rdf_type: xsd:nonNegativeInteger
        title: Minute
      second:
        anyOf:
        - type: number
        - type: 'null'
        default:
        description: Second position in a calendar-clock system.
        rdf_term: http://www.w3.org/2006/time#second
        rdf_type: xsd:decimal
        title: Second
      week:
        anyOf:
        - minimum: 0
          type: integer
        - type: 'null'
        default:
        description: Week number within the year.
        rdf_term: http://www.w3.org/2006/time#week
        rdf_type: xsd:nonNegativeInteger
        title: Week
      dayOfYear:
        anyOf:
        - minimum: 0
          type: integer
        - type: 'null'
        default:
        description: The number of the day within the year
        rdf_term: http://www.w3.org/2006/time#dayOfYear
        rdf_type: xsd:nonNegativeInteger
        title: Dayofyear
      dayOfWeek:
        anyOf:
        - format: uri
          minLength: 1
          type: string
        - type: 'null'
        default:
        description: The day of week, whose value is a member of the class 
          time:DayOfWeek
        rdf_term: http://www.w3.org/2006/time#dayOfWeek
        rdf_type: uri
        title: Dayofweek
      monthOfYear:
        anyOf:
        - format: uri
          minLength: 1
          type: string
        - type: 'null'
        default:
        description: The month of the year, whose value is a member of the class
          time:MonthOfYear
        rdf_term: http://www.w3.org/2006/time#monthOfYear
        rdf_type: uri
        title: Monthofyear
    required:
    - unitType
    - hasTRS
    title: GeneralDateTimeDescription
    type: object
  TimePosition:
    $IRI: http://www.w3.org/2006/time#TimePosition
    $namespace: http://www.w3.org/2006/time#
    $ontology: https://www.w3.org/TR/owl-time/
    $prefix: time
    additionalProperties: false
    description: "A temporal position described using either a (nominal) value from
      an ordinal reference system,\nor a (numeric) value in a temporal coordinate
      system."
    properties:
      nominalPosition:
        anyOf:
        - type: string
        - type: 'null'
        default:
        description: The (nominal) value indicating temporal position in an 
          ordinal reference system
        rdf_term: http://www.w3.org/2006/time#nominalPosition
        rdf_type: xsd:string
        title: Nominalposition
      numericPosition:
        anyOf:
        - type: number
        - type: 'null'
        default:
        description: The (numeric) value indicating position within a temporal 
          coordinate system
        rdf_term: http://www.w3.org/2006/time#numericPosition
        rdf_type: xsd:decimal
        title: Numericposition
      hasTRS:
        description: The temporal reference system used by a temporal position 
          or extent description
        format: uri
        minLength: 1
        rdf_term: http://www.w3.org/2006/time#hasTRS
        rdf_type: uri
        title: Hastrs
        type: string
    required:
    - hasTRS
    title: TimePosition
    type: object
$namespace: http://www.w3.org/2006/time#
$ontology: https://www.w3.org/TR/owl-time/
$prefix: time
additionalProperties: false
description: A temporal entity with zero extent or duration
properties:
  inXSDDate:
    anyOf:
    - format: date
      type: string
    - type: 'null'
    default:
    description: Position of an instant, expressed using xsd:date
    rdf_term: http://www.w3.org/2006/time#inXSDDate
    rdf_type: xsd:date
    title: Inxsddate
  inXSDDateTime:
    anyOf:
    - format: date-time
      type: string
    - type: 'null'
    default:
    deprecated: true
    description: (deprecated) Position of an instant, expressed using 
      xsd:dateTime
    rdf_term: http://www.w3.org/2006/time#inXSDDateTime
    rdf_type: xsd:dateTime
    title: Inxsddatetime
  inXSDDateTimeStamp:
    anyOf:
    - format: date-time
      type: string
    - type: 'null'
    default:
    description: Position of an instant, expressed using xsd:dateTimeStamp, in 
      which the time-zone field is mandatory
    rdf_term: http://www.w3.org/2006/time#inXSDDateTimeStamp
    rdf_type: xsd:dateTimeStamp
    title: Inxsddatetimestamp
  inXSDgYear:
    anyOf:
    - pattern: 
        -?([1-9][0-9]{3,}|0[0-9]{3})(Z|(\+|-)((0[0-9]|1[0-3]):[0-5][0-9]|14:00))?
      type: string
    - type: 'null'
    default:
    description: Position of an instant, expressed using xsd:gYear
    rdf_term: http://www.w3.org/2006/time#inXSDgYear
    rdf_type: xsd:gYear
    title: Inxsdgyear
  inXSDgYearMonth:
    anyOf:
    - pattern: 
        -?([1-9][0-9]{3,}|0[0-9]{3})-(0[1-9]|1[0-2])(Z|(\+|-)((0[0-9]|1[0-3]):[0-5][0-9]|14:00))?
      type: string
    - type: 'null'
    default:
    description: Position of an instant, expressed using xsd:gYearMonth
    rdf_term: http://www.w3.org/2006/time#inXSDgYearMonth
    rdf_type: xsd:gYearMonth
    title: Inxsdgyearmonth
  inTimePosition:
    anyOf:
    - $ref: '#/$defs/TimePosition'
    - type: 'null'
    default:
    description: Position of an instant, expressed as a temporal coordinate or 
      nominal val
    rdf_term: http://www.w3.org/2006/time#inTimePosition
    rdf_type: http://www.w3.org/2006/time#TimePosition
  inDateTime:
    anyOf:
    - $ref: '#/$defs/GeneralDateTimeDescription'
    - type: 'null'
    default:
    description: Position of an instant, expressed using a structured 
      description
    rdf_term: http://www.w3.org/2006/time#inDateTime
    rdf_type: http://www.w3.org/2006/time#GeneralDateTimeDescription
title: TimeInstant
type: object
